name: HLS Local Integration

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/hls.yml"
      - "scripts/ci/**"
      - "config/ci-tools.lock.tsv"
      - "lib/core/guards.sh"
      - "lib/core/logging.sh"
      - "lib/install/download.sh"
      - "lib/install/checksum.sh"
      - "bin/hls-download"
      - "libexec/mantle/commands/hls-download.sh"
      - "libexec/mantle/hls*.py"
      - "tests/bin/hls-download.bats"
      - "tests/integration/hls-download.bats"
      - "tests/test_helper/hls.bash"
      - "tests/fixtures/hls/**"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/hls.yml"
      - "scripts/ci/**"
      - "config/ci-tools.lock.tsv"
      - "lib/core/guards.sh"
      - "lib/core/logging.sh"
      - "lib/install/download.sh"
      - "lib/install/checksum.sh"
      - "bin/hls-download"
      - "libexec/mantle/commands/hls-download.sh"
      - "libexec/mantle/hls*.py"
      - "tests/bin/hls-download.bats"
      - "tests/integration/hls-download.bats"
      - "tests/test_helper/hls.bash"
      - "tests/fixtures/hls/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hls:
    name: HLS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MANTLE_REQUIRE_HLS_TESTS: "1"
      BATS_TEST_TIMEOUT: "90"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install host-managed Linux media and shell tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes ffmpeg zsh fish

      - name: Ensure host-managed macOS media tools
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Install verified Bats
        run: |
          /bin/bash ./scripts/ci/setup-tools.sh --prefix "${RUNNER_TEMP}/mantle-ci-tools" bats
          printf '%s\n' "${RUNNER_TEMP}/mantle-ci-tools/bin" >>"${GITHUB_PATH}"

      - name: Use the stock Bash for executable wrappers
        run: |
          mkdir -p "${RUNNER_TEMP}/mantle-stock-shell"
          ln -s "/bin/bash" "${RUNNER_TEMP}/mantle-stock-shell/bash"
          printf '%s\n' "${RUNNER_TEMP}/mantle-stock-shell" >>"${GITHUB_PATH}"

      - name: Report media and stock shell versions
        run: |
          /bin/bash --version | head -1
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1

      - name: Validate catalog and local HLS behavior
        run: |
          ./bin/mantle catalog validate
          /bin/bash ./tests/run.sh tests/bin/hls-download.bats
          /bin/bash ./tests/run.sh tests/integration/hls-download.bats
