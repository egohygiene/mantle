name: Publish Mantle release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build, verify, sign, and publish
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout the immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build deterministic source distribution
        id: package
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          release_version="${GITHUB_REF_NAME#v}"
          test "${release_version}" != "${GITHUB_REF_NAME}"
          python3 scripts/package-release.py \
            --version "${release_version}" \
            --output-dir dist
          printf 'version=%s\n' "${release_version}" >>"${GITHUB_OUTPUT}"
          printf 'archive=dist/mantle-%s.tar.gz\n' "${release_version}" >>"${GITHUB_OUTPUT}"

      - name: Exercise the isolated release lifecycle
        shell: bash
        run: |
          scripts/verify-release.sh \
            --archive "${{ steps.package.outputs.archive }}" \
            --version "${{ steps.package.outputs.version }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign the source distribution with GitHub OIDC
        shell: bash
        run: |
          cosign sign-blob --yes \
            --bundle "${{ steps.package.outputs.archive }}.sigstore.json" \
            "${{ steps.package.outputs.archive }}"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum \
            "mantle-${{ steps.package.outputs.version }}.tar.gz" \
            "mantle-${{ steps.package.outputs.version }}.tar.gz.sigstore.json" >SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "${{ steps.package.outputs.archive }}"

      - name: Publish the signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          release_arguments=()
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            release_arguments+=(--prerelease)
          fi
          release_assets=(
            "dist/mantle-${RELEASE_VERSION}.tar.gz"
            "dist/mantle-${RELEASE_VERSION}.tar.gz.sigstore.json"
            "dist/SHA256SUMS"
          )

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${release_assets[@]}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${release_assets[@]}" \
              --verify-tag \
              --title "Mantle ${RELEASE_VERSION}" \
              --generate-notes \
              "${release_arguments[@]}"
          fi
