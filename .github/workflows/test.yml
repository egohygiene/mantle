name: Test Suite

on:
  workflow_dispatch:
    inputs:
      upload-diagnostics:
        description: Upload isolated failure diagnostics (storage opt-in).
        required: false
        default: false
        type: boolean
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Static validation — syntax, ShellCheck, and formatting.
  # ---------------------------------------------------------------------------
  static:
    name: Static Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install host-managed static dependencies
        run: sudo apt-get update --quiet && sudo apt-get install --yes shellcheck zsh fish gawk

      - name: Install verified static tools
        run: |
          /bin/bash ./scripts/ci/setup-tools.sh --prefix "${RUNNER_TEMP}/mantle-ci-tools" shfmt shdoc
          printf '%s\n' "${RUNNER_TEMP}/mantle-ci-tools/bin" >>"${GITHUB_PATH}"

      - name: Run static validation
        run: /bin/bash ./tests/run.sh --strict static

      - name: Validate the bundled Fastfetch configuration offline
        run: python3 tests/validate_fastfetch.py

  # ---------------------------------------------------------------------------
  # Behavioral tests on Linux, including the complete legacy bin/ catalog.
  # ---------------------------------------------------------------------------
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install host-managed validation dependencies
        run: |
          sudo apt-get update --quiet
          sudo apt-get install --yes shellcheck zsh fish gawk

      - name: Install verified validation tools
        run: |
          /bin/bash ./scripts/ci/setup-tools.sh --prefix "${RUNNER_TEMP}/mantle-ci-tools" bats shfmt shdoc
          printf '%s\n' "${RUNNER_TEMP}/mantle-ci-tools/bin" >>"${GITHUB_PATH}"

      - name: Report platform and shell interpreters
        run: |
          printf 'source revision: %s\n' "$(git rev-parse HEAD)"
          uname -s
          uname -m
          python3 --version
          printf 'installer shell: %s\n' "/bin/bash"
          /bin/bash --version | head -1
          zsh --version
          fish --version
          bats --version
          shellcheck --version
          shfmt --version
          gawk --version | head -1

      - name: Run complete strict validation
        run: /bin/bash ./tests/run.sh --strict all

      - name: Verify the temporary-prefix install lifecycle
        run: /bin/bash ./tests/smoke/install.sh

      - name: Verify the reviewed release-source proposal
        id: release-source
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          # The first dated entry selects the source proposal, not release authority.
          mantle_candidate_tag="$(
            python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          entries = re.findall(r"^## \[([^\]]+)\] - ", text, re.M)
          if not entries:
              raise SystemExit("A reviewed dated changelog proposal is required.")
          print("v" + entries[0])
          PY
          )"
          python3 scripts/release-control.py verify --version "${mantle_candidate_tag}" \
            --source-revision "${GITHUB_SHA}"
          printf 'version=%s\n' "${mantle_candidate_tag#v}" >>"${GITHUB_OUTPUT}"

      - name: Verify the clean unsigned candidate package and install lifecycle
        shell: bash
        env:
          MANTLE_CI_CANDIDATE_VERSION: ${{ steps.release-source.outputs.version }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          mantle_candidate_version="${MANTLE_CI_CANDIDATE_VERSION}"
          mantle_candidate_directory="$(mktemp -d "${RUNNER_TEMP}/mantle-candidate-package.XXXXXXXX")"
          mantle_candidate_archive="${mantle_candidate_directory}/mantle-${mantle_candidate_version}.tar.gz"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          printf 'Unsigned and unpublished candidate source: %s\n' "${GITHUB_SHA}"
          ./bin/mantle profiles validate
          ./bin/mantle catalog validate
          python3 scripts/package-release.py --source-dir "${GITHUB_WORKSPACE}" \
            --version "${mantle_candidate_version}" --output-dir "${mantle_candidate_directory}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            shasum -a 256 "${mantle_candidate_archive}"
          else
            sha256sum "${mantle_candidate_archive}"
          fi
          /bin/bash scripts/verify-release.sh --archive "${mantle_candidate_archive}" \
            --version "${mantle_candidate_version}"
          printf '%s\n' 'Candidate package and install verification only; no signature, attestation, tag or publication.'

      - name: Upload test diagnostics on failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.upload-diagnostics }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-diagnostics-linux
          path: /tmp/mantle-test-*/
          if-no-files-found: ignore
          retention-days: 1
          # Do not upload files that could contain credentials.

  # ---------------------------------------------------------------------------
  # Portable runtime, installer, release, and contract tests on macOS.
  # ---------------------------------------------------------------------------
  test-macos:
    name: Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Use the stock Bash for executable wrappers
        run: |
          mkdir -p "${RUNNER_TEMP}/mantle-stock-shell"
          ln -s "/bin/bash" "${RUNNER_TEMP}/mantle-stock-shell/bash"
          printf '%s\n' "${RUNNER_TEMP}/mantle-stock-shell" >>"${GITHUB_PATH}"

      - name: Ensure host-managed native Fish
        run: |
          if ! command -v fish >/dev/null 2>&1; then
            brew install fish
          fi

      - name: Report stock shell interpreters
        run: |
          printf 'source revision: %s\n' "$(git rev-parse HEAD)"
          sw_vers -productVersion
          uname -m
          python3 --version
          printf 'installer shell: %s\n' "/bin/bash"
          /bin/bash --version | head -1
          printf 'zsh shell: %s\n' "$(command -v zsh)"
          zsh --version
          printf 'fish shell: %s\n' "$(command -v fish)"
          fish --version

      - name: Install verified Bats
        run: |
          /bin/bash ./scripts/ci/setup-tools.sh --prefix "${RUNNER_TEMP}/mantle-ci-tools" bats
          printf '%s\n' "${RUNNER_TEMP}/mantle-ci-tools/bin" >>"${GITHUB_PATH}"

      - name: Repeat native startup cleanup regressions
        run: |
          for attempt in 1 2 3 4 5; do
            printf 'Native macOS startup pass %s/5\n' "${attempt}"
            /bin/bash ./tests/run.sh tests/integration/startup.bats
          done

      - name: Run unit tests
        run: /bin/bash ./tests/run.sh unit

      - name: Run integration tests
        run: /bin/bash ./tests/run.sh integration

      - name: Run contract tests
        run: /bin/bash ./tests/run.sh contract

      - name: Run bin CLI tests with stock Bash
        run: /bin/bash ./tests/run.sh bin

      - name: Verify the temporary-prefix install lifecycle
        run: /bin/bash ./tests/smoke/install.sh

      - name: Verify the reviewed release-source proposal
        id: release-source
        shell: bash
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          # The first dated entry selects the source proposal, not release authority.
          mantle_candidate_tag="$(
            python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          entries = re.findall(r"^## \[([^\]]+)\] - ", text, re.M)
          if not entries:
              raise SystemExit("A reviewed dated changelog proposal is required.")
          print("v" + entries[0])
          PY
          )"
          python3 scripts/release-control.py verify --version "${mantle_candidate_tag}" \
            --source-revision "${GITHUB_SHA}"
          printf 'version=%s\n' "${mantle_candidate_tag#v}" >>"${GITHUB_OUTPUT}"

      - name: Verify the clean unsigned candidate package and install lifecycle
        shell: bash
        env:
          MANTLE_CI_CANDIDATE_VERSION: ${{ steps.release-source.outputs.version }}
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          mantle_candidate_version="${MANTLE_CI_CANDIDATE_VERSION}"
          mantle_candidate_directory="$(mktemp -d "${RUNNER_TEMP}/mantle-candidate-package.XXXXXXXX")"
          mantle_candidate_archive="${mantle_candidate_directory}/mantle-${mantle_candidate_version}.tar.gz"
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          printf 'Unsigned and unpublished candidate source: %s\n' "${GITHUB_SHA}"
          ./bin/mantle profiles validate
          ./bin/mantle catalog validate
          python3 scripts/package-release.py --source-dir "${GITHUB_WORKSPACE}" \
            --version "${mantle_candidate_version}" --output-dir "${mantle_candidate_directory}"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            shasum -a 256 "${mantle_candidate_archive}"
          else
            sha256sum "${mantle_candidate_archive}"
          fi
          /bin/bash scripts/verify-release.sh --archive "${mantle_candidate_archive}" \
            --version "${mantle_candidate_version}"
          printf '%s\n' 'Candidate package and install verification only; no signature, attestation, tag or publication.'

      - name: Upload test diagnostics on failure
        if: ${{ failure() && github.event_name == 'workflow_dispatch' && inputs.upload-diagnostics }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-diagnostics-macos
          path: /tmp/mantle-test-*/
          if-no-files-found: ignore
          retention-days: 1
