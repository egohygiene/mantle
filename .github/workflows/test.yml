name: Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Static validation — syntax, ShellCheck, and formatting.
  # ---------------------------------------------------------------------------
  static:
    name: Static Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install static validation tools
        run: sudo apt-get update --quiet && sudo apt-get install --yes shellcheck zsh fish

      - name: Install shfmt
        run: |
          SHFMT_VERSION="3.8.0"
          curl -fsSL \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /usr/local/bin/shfmt
          chmod 0755 /usr/local/bin/shfmt

      - name: Install shdoc
        run: |
          git clone --filter=blob:none --depth 1 https://github.com/reconquest/shdoc.git /tmp/shdoc
          sudo install -m 0755 /tmp/shdoc/shdoc /usr/local/bin/shdoc

      - name: Run static validation
        run: /bin/bash ./tests/run.sh --strict static

      - name: Validate the bundled Fastfetch configuration offline
        run: python3 tests/validate_fastfetch.py

  # ---------------------------------------------------------------------------
  # Behavioral tests on Linux, including the complete legacy bin/ catalog.
  # ---------------------------------------------------------------------------
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zsh fish

      - name: Install Bats
        run: |
          BATS_VERSION="1.11.0"
          curl -fsSL \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            -o /tmp/bats.tar.gz
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-${BATS_VERSION}/install.sh /usr/local

      - name: Run unit tests
        run: /bin/bash ./tests/run.sh unit

      - name: Run integration tests
        run: /bin/bash ./tests/run.sh integration

      - name: Run contract tests
        run: /bin/bash ./tests/run.sh contract

      - name: Run bin CLI tests
        run: /bin/bash ./tests/run.sh bin

      - name: Verify the temporary-prefix install lifecycle
        run: /bin/bash ./tests/smoke/install.sh

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-diagnostics-linux
          path: /tmp/mantle-test-*/
          if-no-files-found: ignore
          # Do not upload files that could contain credentials.

  # ---------------------------------------------------------------------------
  # Portable runtime, installer, release, and contract tests on macOS.
  # ---------------------------------------------------------------------------
  test-macos:
    name: Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Use the stock Bash for executable wrappers
        run: |
          mkdir -p "${RUNNER_TEMP}/mantle-stock-shell"
          ln -s "/bin/bash" "${RUNNER_TEMP}/mantle-stock-shell/bash"
          printf '%s\n' "${RUNNER_TEMP}/mantle-stock-shell" >>"${GITHUB_PATH}"

      - name: Report stock shell interpreters
        run: |
          sw_vers -productVersion
          uname -m
          python3 --version
          printf 'installer shell: %s\n' "/bin/bash"
          /bin/bash --version | head -1
          printf 'zsh shell: %s\n' "$(command -v zsh)"
          zsh --version

      - name: Install Bats
        run: |
          BATS_VERSION="1.11.0"
          curl -fsSL \
            "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VERSION}.tar.gz" \
            -o /tmp/bats.tar.gz
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-${BATS_VERSION}/install.sh /usr/local

      - name: Repeat native startup cleanup regressions
        run: |
          for attempt in 1 2 3 4 5; do
            printf 'Native macOS startup pass %s/5\n' "${attempt}"
            /bin/bash ./tests/run.sh tests/integration/startup.bats
          done

      - name: Run unit tests
        run: /bin/bash ./tests/run.sh unit

      - name: Run integration tests
        run: /bin/bash ./tests/run.sh integration

      - name: Run contract tests
        run: /bin/bash ./tests/run.sh contract

      - name: Run bin CLI tests with stock Bash
        run: /bin/bash ./tests/run.sh bin

      - name: Verify the temporary-prefix install lifecycle
        run: /bin/bash ./tests/smoke/install.sh

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-diagnostics-macos
          path: /tmp/mantle-test-*/
          if-no-files-found: ignore
