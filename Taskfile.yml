version: "3"

tasks:
  default:
    desc: Show supported developer tasks.
    cmds:
      - task --list

  validate:
    desc: Validate profile metadata, command coverage, and existing static checks.
    cmds:
      - task: profiles:validate
      - task: catalog:validate
      - ./tests/run.sh --local static

  test:
    desc: Run the existing complete Bats and static validation suite.
    cmds:
      - ./tests/run.sh --local all

  doctor:
    desc: Run existing installation and shell diagnostics.
    cmds:
      - ./bin/mantle doctor

  profiles:list:
    desc: List runtime profiles and inherited capabilities.
    cmds:
      - ./bin/mantle profiles list

  profiles:validate:
    desc: Validate the shared profile inheritance graph.
    cmds:
      - ./bin/mantle profiles validate

  catalog:list:
    desc: List public command metadata.
    cmds:
      - ./bin/mantle catalog list

  catalog:validate:
    desc: Check metadata and coverage for every public command.
    cmds:
      - ./bin/mantle catalog validate

  status:
    desc: Diagnose the repository-local Mantle installation.
    cmds:
      - task: doctor

  lint:
    desc: Run developer-friendly static validation.
    cmds:
      - ./tests/run.sh --local static

  install:smoke:
    desc: Exercise the hermetic temporary-prefix install lifecycle.
    cmds:
      - /bin/bash ./tests/smoke/install.sh

  docs:
    desc: Validate the maintained documentation contract.
    cmds:
      - ./tests/run.sh tests/contract/documentation.bats

  check:
    desc: Run local validation and the installation lifecycle.
    cmds:
      - task: test
      - task: install:smoke

  ci:
    desc: Reproduce strict validation and the installation lifecycle.
    cmds:
      - ./tests/run.sh --strict all
      - task: install:smoke

  release:plan:
    desc: Inspect an exact stable release proposal without mutation or publication.
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: "{{.VERSION}}"
    cmds:
      - python3 scripts/release-control.py plan --version "${RELEASE_VERSION}"

  release:prepare:
    desc: Print a reviewable changelog promotion patch; do not apply it automatically.
    requires:
      vars: [VERSION, RELEASE_DATE]
    env:
      RELEASE_VERSION: "{{.VERSION}}"
      RELEASE_DATE: "{{.RELEASE_DATE}}"
    cmds:
      - python3 scripts/release-control.py prepare --version "${RELEASE_VERSION}" --date "${RELEASE_DATE}"

  release:verify:
    desc: Check committed local preparation and the isolated archive installation lifecycle.
    requires:
      vars: [VERSION, ARCHIVE]
    env:
      RELEASE_VERSION: "{{.VERSION}}"
      RELEASE_ARCHIVE: "{{.ARCHIVE}}"
    cmds:
      - python3 scripts/release-control.py verify --version "${RELEASE_VERSION}"
      - /bin/bash scripts/verify-release.sh --archive "${RELEASE_ARCHIVE}" --version "${RELEASE_VERSION#v}"

  release:publish:
    desc: Hand off an approved candidate to manual GitHub input prompts; never publish locally.
    cmds:
      - gh workflow run .github/workflows/release.yml
